# Tests van het autorisatiemodel (opdracht 4).
# Lokaal:    fga model test --tests authz/model.fga.yaml
# Pipeline:  job "authz-model" (openfga/cli in Docker).
# Ook te openen in play.fga.dev (Import store).
name: Unbreakable
model_file: ./model.fga

# Bericht 1: Anna -> Bram. Bericht 2: Bram -> Anna.
tuples:
  - user: user:anna
    relation: sender
    object: message:1
  - user: user:bram
    relation: recipient
    object: message:1
  - user: user:bram
    relation: sender
    object: message:2
  - user: user:anna
    relation: recipient
    object: message:2

tests:
  - name: enkel de ontvanger kan lezen
    check:
      - user: user:bram
        object: message:1
        assertions:
          can_read: true
      - user: user:anna
        object: message:1
        assertions:
          can_read: false     # de afzender kan zijn eigen bericht NIET lezen
      - user: user:chris
        object: message:1
        assertions:
          can_read: false     # een derde al zeker niet

  - name: enkel de afzender kan verwijderen
    check:
      - user: user:anna
        object: message:1
        assertions:
          can_delete: true
      - user: user:bram
        object: message:1
        assertions:
          can_delete: false   # de ontvanger kan het niet verwijderen
      - user: user:chris
        object: message:1
        assertions:
          can_delete: false

  - name: inbox en export (ListObjects)
    list_objects:
      - user: user:anna
        type: message
        assertions:
          can_read:
            - message:2
          can_delete:
            - message:1
      - user: user:bram
        type: message
        assertions:
          can_read:
            - message:1
          can_delete:
            - message:2
      - user: user:chris
        type: message
        assertions:
          can_read: []
          can_delete: []
