# Unbreakable - eindtoestand na opdracht 4.
#
# Opdracht 2: enkel BunkerWeb (de WAF) publiceert poort 80 en 443.
# Opdracht 4: twee nieuwe bouwblokken, elk met een eigen databank:
#   - keycloak  : de identity provider (OIDC). Wie ben je?
#   - openfga   : de policy decision point (PDP). Wat mag je?
# De app is enkel nog de policy enforcement point (PEP): ze vraagt bij elk
# verzoek op een bericht aan OpenFGA of het mag.
#
# Netwerken (elk component ziet enkel wat het nodig heeft):
#   bw-services : BunkerWeb <-> app, BunkerWeb <-> keycloak, app -> keycloak (JWKS)
#   internal    : app <-> db
#   kc-internal : keycloak <-> kc-db
#   authz       : app -> openfga, fga-init -> openfga
#   fga-internal: openfga <-> fga-db

services:
  # ------------------------------------------------------------- de WAF
  bunkerweb:
    image: bunkerity/bunkerweb-all-in-one:1.6.15
    # Enige dienst die naar buiten luistert.
    ports:
      - "80:8080/tcp"
      - "443:8443/tcp"
      - "443:8443/udp"   # QUIC / HTTP3
    volumes:
      - bw-storage:/data  # bewaart o.a. het Let's Encrypt-certificaat
    environment:
      API_WHITELIST_IP: "127.0.0.0/8"
      SERVICE_UI: "no"

      SERVER_NAME: "${DOMAIN}"
      USE_REVERSE_PROXY: "yes"

      # Alles naar de app ...
      REVERSE_PROXY_HOST: "http://app:8080"
      REVERSE_PROXY_URL: "/"
      # ... behalve de login van de realm "unbreakable" (opdracht 4).
      # Bewust ENKEL deze realm en de statische bestanden van het loginscherm:
      # de master-realm, de beheerconsole (/auth/admin) en de admin REST API
      # worden niet doorgegeven en zijn dus niet bereikbaar vanaf internet (T13).
      REVERSE_PROXY_HOST_1: "http://keycloak:8080"
      REVERSE_PROXY_URL_1: "/auth/realms/unbreakable/"
      REVERSE_PROXY_HOST_2: "http://keycloak:8080"
      REVERSE_PROXY_URL_2: "/auth/resources/"

      # HTTPS via Let's Encrypt.
      AUTO_LETS_ENCRYPT: "yes"
      USE_LETS_ENCRYPT_STAGING: "no"
      EMAIL_LETS_ENCRYPT: "${LETSENCRYPT_EMAIL}"
      LETS_ENCRYPT_CHALLENGE: "http"
      REDIRECT_HTTP_TO_HTTPS: "yes"

      # OWASP Core Rule Set + ModSecurity.
      USE_MODSECURITY: "yes"
      USE_MODSECURITY_CRS: "yes"
      MODSECURITY_CRS_VERSION: "4"
      MODSECURITY_SEC_RULE_ENGINE: "On"

      USE_LIMIT_REQ: "yes"
      LIMIT_REQ_RATE: "10r/s"
      # Nog steeds uit: een ban treft iedereen (P10).
      USE_BAD_BEHAVIOR: "no"

      ALLOWED_METHODS: "GET|POST|HEAD|DELETE"
    depends_on:
      - app
      - keycloak
    restart: unless-stopped
    networks:
      - bw-services

  # ------------------------------------------------------------- de app (PEP)
  app:
    build: ./app
    mem_limit: 384m
    expose:
      - "8080"
    environment:
      ConnectionStrings__Unbreakable: "Host=db;Port=5432;Database=unbreakable;Username=unbreakable;Password=${DB_PASSWORD}"
      # Identity provider. De issuer is de PUBLIEKE url (zo staat hij in het
      # token). De sleutels (JWKS) haalt de app intern op, rechtstreeks bij
      # Keycloak: de container kan het publieke IPv6-adres niet bereiken.
      Oidc__Issuer: "https://${DOMAIN}/auth/realms/unbreakable"
      Oidc__MetadataAddress: "http://keycloak:8080/auth/realms/unbreakable/.well-known/openid-configuration"
      Oidc__Audience: "unbreakable-api"
      Oidc__ClientId: "unbreakable-spa"
      # Policy decision point.
      OpenFga__ApiUrl: "http://openfga:8080"
      OpenFga__StoreName: "unbreakable"
      OpenFga__ApiKey: "${FGA_API_KEY}"
    depends_on:
      db:
        condition: service_healthy
      fga-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
    restart: unless-stopped
    networks:
      - bw-services
      - internal
      - authz

  # ------------------------------------------------------------- databank van de app
  db:
    image: postgres:17
    mem_limit: 256m
    environment:
      POSTGRES_DB: unbreakable
      POSTGRES_USER: unbreakable
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # Opdracht 4: nieuw volume. Er komt een tabel Users bij en EnsureCreated
      # past een bestaande databank niet aan. De berichten van opdracht 3 hebben
      # bovendien geen tuples in OpenFGA, dus niemand zou ze nog mogen lezen.
      - dbdata_o4:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unbreakable -d unbreakable"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - internal

  # ------------------------------------------------------------- identity provider
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start", "--import-realm"]
    # Geheugen begrenzen: zonder limiet neemt Java een groot deel van het RAM
    # en kan de hele machine (ook SSH) vastlopen (A8/A12).
    mem_limit: 768m
    environment:
      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://kc-db:5432/keycloak"
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      # Publiek adres: https://<domein>/auth, achter BunkerWeb (TLS stopt daar).
      KC_HOSTNAME: "https://${DOMAIN}/auth"
      KC_HTTP_RELATIVE_PATH: "/auth"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: "xforwarded"
      # De app haalt de JWKS intern op (http://keycloak:8080): backchannel-URL's
      # volgen dan het verzoek, de issuer blijft de publieke URL.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # Beheerconsole enkel via een SSH-tunnel naar localhost:8081 (T13).
      KC_HOSTNAME_ADMIN: "http://localhost:8081/auth"
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=65 -XX:InitialRAMPercentage=10"
      # Eerste beheerder, enkel gebruikt bij de allereerste start.
      KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      # Gebruikt als placeholder ${DOMAIN} in keycloak/unbreakable-realm.json.
      DOMAIN: "${DOMAIN}"
    volumes:
      - ./keycloak/unbreakable-realm.json:/opt/keycloak/data/import/unbreakable-realm.json:ro
    ports:
      # Enkel op de loopback van de machine, voor de beheerconsole via
      # ssh -L 8081:127.0.0.1:8081 g02. Nooit publiek.
      - "127.0.0.1:8081:8080"
    depends_on:
      kc-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bw-services
      - kc-internal

  kc-db:
    image: postgres:17
    mem_limit: 256m
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - kcdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - kc-internal

  # ------------------------------------------------------------- policy decision point
  openfga:
    image: openfga/openfga:v1.22.1
    command: ["run"]
    mem_limit: 256m
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: "postgres://openfga:${FGA_DB_PASSWORD}@fga-db:5432/openfga?sslmode=disable"
      # Enkel wie de preshared key kent, mag de PDP aanspreken (app en fga-init).
      OPENFGA_AUTHN_METHOD: preshared
      OPENFGA_AUTHN_PRESHARED_KEYS: ${FGA_API_KEY}
      # Geen speeltuin en geen publieke poorten in productie.
      OPENFGA_PLAYGROUND_ENABLED: "false"
      OPENFGA_LOG_FORMAT: json
    depends_on:
      fga-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - authz
      - fga-internal

  # Maakt de tabellen van OpenFGA aan of werkt ze bij (eenmalig per deploy).
  fga-migrate:
    image: openfga/openfga:v1.22.1
    command: ["migrate"]
    mem_limit: 128m
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: "postgres://openfga:${FGA_DB_PASSWORD}@fga-db:5432/openfga?sslmode=disable"
    depends_on:
      fga-db:
        condition: service_healthy
    restart: "no"
    networks:
      - fga-internal

  # Policy administration point: zet de store en het model uit authz/model.json
  # in OpenFGA. Het model komt dus uit git (review via PR, historiek, pipeline).
  fga-init:
    image: curlimages/curl:8.23.0
    mem_limit: 32m
    entrypoint: ["/bin/sh", "/authz/init.sh"]
    environment:
      FGA_API_KEY: ${FGA_API_KEY}
    volumes:
      - ./authz:/authz:ro
    depends_on:
      openfga:
        condition: service_started
    restart: "no"
    networks:
      - authz

  fga-db:
    image: postgres:17
    mem_limit: 256m
    environment:
      POSTGRES_DB: openfga
      POSTGRES_USER: openfga
      POSTGRES_PASSWORD: ${FGA_DB_PASSWORD}
    volumes:
      - fgadata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openfga -d openfga"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - fga-internal

volumes:
  dbdata_o4:
  kcdata:
  fgadata:
  bw-storage:

networks:
  bw-services:
    name: bw-services
  internal:
  kc-internal:
  authz:
  fga-internal:
